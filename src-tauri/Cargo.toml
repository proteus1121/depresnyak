[package]
name = "depresnyak"
version = "3.1.0"
description = "Кот Депресняк — настольный питомец (Ruffle + Tauri)"
authors = ["Artem Ishchenko"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = ["tray-icon"] }
tauri-plugin-single-instance = "=2.5.4"
tauri-plugin-autostart = "=2.7.0"
tauri-plugin-dialog = "=2.8.3"
tauri-plugin-opener = "=2.7.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
